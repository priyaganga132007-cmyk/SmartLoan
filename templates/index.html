<!DOCTYPE html>
<html>

<head>

    <title>SmartLoan</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <h1>🏦 SmartLoan</h1>

        <p class="subtitle">
            Smart Loan Eligibility & Risk Assessment
        </p>


        <div class="card">

            <h2>Enter Your Details</h2>


            <label>Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <label>Monthly Income (₹)</label>

            <input
                type="number"
                id="income"
                placeholder="Example: 50000"
            >


            <label>Loan Amount (₹)</label>

            <input
                type="number"
                id="loan_amount"
                placeholder="Example: 300000"
            >


            <label>Credit Score</label>

            <input
                type="number"
                id="credit_score"
                min="300"
                max="900"
                placeholder="Example: 750"
            >


            <label>Interest Rate (%)</label>

            <input
                type="number"
                id="interest_rate"
                value="10"
            >


            <label>Loan Tenure (Years)</label>

            <input
                type="number"
                id="tenure_years"
                value="5"
            >


            <button onclick="checkLoan()">
                Check Eligibility
            </button>

        </div>


        <div id="result" class="result">

            <h2>📊 Loan Result</h2>

            <p>
                Name:
                <span id="nameResult">-</span>
            </p>

            <p>
                Monthly EMI:
                <span id="emi">-</span>
            </p>

            <p>
                Eligibility:
                <span id="eligibility">-</span>
            </p>

            <p>
                Risk Level:
                <span id="risk">-</span>
            </p>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
